name: Prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify launcher and file discovery
        run: python -m unittest discover -s tests -v
      - name: Prepare verified Godot runtime
        run: python tools/d4vr.py setup
      - name: Verify camera transforms and serialized XR bindings
        run: python tools/d4vr.py test
      - name: Load complete synthetic scene
        run: python tools/d4vr.py smoke
      - name: Configure native observation tests
        run: cmake -S native -B work/native-ci
      - name: Build native components
        run: cmake --build work/native-ci --config Release
      - name: Test observation and Windows forwarding
        run: ctest --test-dir work/native-ci -C Release --output-on-failure
      - name: Compile native XR and validate diagnostic shaders without a headset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopenxr-dev libvulkan-dev glslang-tools spirv-tools
          cmake -S native -B work/native-xr-ci -DD4VR_BUILD_XR_READINESS=ON -DD4VR_BUILD_GPU_PROBE_FIXTURE=ON -DD4VR_BUILD_VULKAN_TRACE=ON -DD4VR_TRACE_WITH_XR_BINDING=ON
          cmake --build work/native-xr-ci --parallel 2
          ctest --test-dir work/native-xr-ci --output-on-failure
          spirv-val --target-env vulkan1.2 work/native-xr-ci/scene.vert.spv
          spirv-val --target-env vulkan1.2 work/native-xr-ci/scene.frag.spv
          glslangValidator -V --target-env vulkan1.1 -Od native/probe_gpu/geometry_shift.vert -o work/native-xr-ci/geometry.spv
          glslangValidator -V --target-env vulkan1.1 native/tests/probe_fixture.vert -o work/native-xr-ci/fixture.spv
          python tools/spirv_probe.py work/native-xr-ci/fixture.spv --helper work/native-xr-ci/geometry.spv --tools /usr/bin --output work/native-xr-ci/instrumented.spv --geometry
          glslangValidator -V --target-env vulkan1.1 -Od native/probe_gpu/stereo_transform.vert -o work/native-xr-ci/stereo-transform.spv
          python tools/spirv_probe.py work/native-xr-ci/fixture.spv --helper work/native-xr-ci/stereo-transform.spv --tools /usr/bin --output work/native-xr-ci/stereo-instrumented.spv --stereo
          glslangValidator -V --target-env vulkan1.1 native/tests/stereo_mrt.vert -o work/native-xr-ci/mrt.vert.spv
          glslangValidator -V --target-env vulkan1.1 native/tests/stereo_mrt.frag -o work/native-xr-ci/mrt.frag.spv
          glslangValidator -V --target-env vulkan1.2 native/tests/descriptor_echo.comp -o work/native-xr-ci/descriptor-echo.spv
          spirv-val --target-env vulkan1.2 work/native-xr-ci/descriptor-echo.spv
          python tools/spirv_probe.py work/native-xr-ci/mrt.vert.spv --helper work/native-xr-ci/stereo-transform.spv --tools /usr/bin --output work/native-xr-ci/mrt-instrumented.spv --stereo
          glslangValidator -V --target-env vulkan1.1 native/tests/stereo_mrt_vertex.vert -o work/native-xr-ci/mrt-vertex.spv
          python tools/spirv_probe.py work/native-xr-ci/mrt-vertex.spv --helper work/native-xr-ci/stereo-transform.spv --tools /usr/bin --output work/native-xr-ci/mrt-vertex-instrumented.spv --stereo
      - name: Check pipeline graphs and layer forwarding with ASan and UBSan
        # No GPU or game is involved in this CPU ownership test.
        if: runner.os == 'Linux'
        run: |
          cmake -S native -B work/recipe-sanitized-ci -DD4VR_BUILD_STEREO_TARGET_TESTS=ON -DD4VR_BUILD_VULKAN_TRACE=ON -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build work/recipe-sanitized-ci --target d4vr_pipeline_recipe_tests d4vr_library_variants_tests d4vr_dynamic_states_tests d4vr_graphics_replay_tests d4vr_replay_specialization_tests d4vr_vulkan_trace_tests --parallel 2
          ctest --test-dir work/recipe-sanitized-ci -R "pipeline_recipe_ownership|library_variant_ownership|gpl_dynamic_state_ownership|graphics_state_replay|replay_specialization_ownership|vulkan_trace_forwarding" --output-on-failure
      - name: Fetch pinned SPIR-V grammar for static audit controls
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: fbf86836a9b1966586faf7be7bb8a6440e156d62
          path: work/spirv-headers
      - name: Verify static shader audit with validated write controls
        if: runner.os == 'Linux'
        run: python tools/shader_effects_validate.py --compiler /usr/bin/glslangValidator --assembler /usr/bin/spirv-as --validator /usr/bin/spirv-val --grammar work/spirv-headers/include/spirv/unified1/spirv.core.grammar.json --glsl-grammar work/spirv-headers/include/spirv/unified1/extinst.glsl.std.450.grammar.json --output-directory work/shader-effects-ci
      - name: Verify telemetry-free helper and preserved source writes
        if: runner.os == 'Linux'
        run: python tools/stereo_helper_validate.py --compiler /usr/bin/glslangValidator --tools /usr/bin --grammar work/spirv-headers/include/spirv/unified1/spirv.core.grammar.json --glsl-grammar work/spirv-headers/include/spirv/unified1/extinst.glsl.std.450.grammar.json --output-directory work/stereo-helper-ci
      - name: Verify full-module non-output write contract
        if: runner.os == 'Linux'
        run: python tools/shader_write_validate.py --compiler /usr/bin/glslangValidator --tools /usr/bin --grammar work/spirv-headers/include/spirv/unified1/spirv.core.grammar.json --glsl-grammar work/spirv-headers/include/spirv/unified1/extinst.glsl.std.450.grammar.json --output-directory work/shader-write-ci
      - name: Verify every Windows export name, ordinal and forwarder
        if: runner.os == 'Windows'
        run: python -c "import pathlib,sys; sys.path.insert(0,'tools'); import probe; probe.validate_probe(pathlib.Path('work/native-ci/probe/Release/sl.interposer.dll'),probe.profile())"
      - name: Fetch pinned Vulkan headers for Windows common component tests
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.3.275
          path: work/vulkan-headers
      - name: Test Vulkan targets and graphics replay on Windows without a driver
        if: runner.os == 'Windows'
        run: |
          cmake -S native -B work/stereo-targets-ci -DD4VR_BUILD_STEREO_TARGET_TESTS=ON "-DD4VR_VULKAN_INCLUDE_DIR=${{ github.workspace }}/work/vulkan-headers/include"
          cmake --build work/stereo-targets-ci --config Release --target d4vr_stereo_targets_tests d4vr_graphics_replay_tests d4vr_frame_trace_tests d4vr_pipeline_recipe_tests d4vr_library_variants_tests d4vr_dynamic_states_tests d4vr_replay_specialization_tests
          ctest --test-dir work/stereo-targets-ci -C Release -R "stereo_target_ownership|graphics_state_replay|vulkan_frame_metadata|pipeline_recipe_ownership|library_variant_ownership|gpl_dynamic_state_ownership|replay_specialization_ownership" --output-on-failure
      - name: Upload Windows probe without vendor or test libraries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: d4vr-streamline-probe-windows-x64
          path: work/native-ci/probe/Release/sl.interposer.dll
          if-no-files-found: error
